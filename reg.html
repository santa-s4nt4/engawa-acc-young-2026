<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>御朱印帳 照合 — 登録</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/reg.css">
</head>

<body>
  <div class="app">
    <div class="rail">
      <div class="brand">御朱印帳 登録</div>
      <div class="eng" id="eng">ENGINE / <b>起動中…</b></div>
    </div>
    <main>
      <div class="loadbar" id="loadbar"></div>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="jsonDlg">
    <h3 style="font-family:var(--mincho);font-weight:400;letter-spacing:.2em;margin:0 0 12px">書き出したJSON</h3>
    <p style="font-size:11.5px;color:var(--nezu);line-height:1.8;margin:0 0 10px">ダウンロードが使えない環境向けの控えです。全選択してコピーしてください。</p>
    <textarea id="jsonOut" readonly></textarea>
    <div class="btnrow" style="margin-top:12px"><button onclick="jsonDlg.close()">閉じる</button></div>
  </dialog>

  <script src="js/common.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/reg.js"></script>
</body>

</html>
